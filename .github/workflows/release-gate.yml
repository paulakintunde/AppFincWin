name: Release gate
on:
  workflow_dispatch: {}
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
jobs:
  decide-switch-live:
    name: decide switch live check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 (v4)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0 (v4)
        with: { node-version: 24, cache: npm }
      - run: npm ci --legacy-peer-deps
      - name: Production read-only check (fails closed if a secret is missing)
        run: node scripts/decide-switch-check.mjs --online
        env:
          SUPABASE_READONLY_TOKEN: ${{ secrets.SUPABASE_READONLY_TOKEN }}
          SUPABASE_PROD_PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
