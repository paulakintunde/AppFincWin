name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 (v4)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0 (v4)
        with: { node-version: 24, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run depcruise
      - run: npm run check:ignores
      - run: npm run test:coverage
      - run: npm run verify:gates
      - name: Cross-check calculator agrees with the engine (QA-03, 1,000 cases)
        run: npm run test:crosscheck
        env:
          CROSSCHECK_RUNS: 1000
      - name: Stryker disables need a reason
        run: npm run check:stryker-disables
      - name: Right answers unchanged without sign-off
        run: |
          git fetch --no-tags --depth=1 origin main
          npm run check:right-answers
      - name: Migration compatibility (FND-10)
        run: npm run lint:migrations
      - name: Migration gate self-test (FND-10)
        run: npm run verify:migrations
      - name: SQL rounding mirror matches the shared fixture (D-16)
        run: npm run check:money-mirror
      - name: SQL recurring schedule mirror matches the shared fixture (D-04)
        run: npm run check:recurring-mirror
      - name: Decide demo seed mirrors the fixture
        run: npm run check:decide-demo-mirror
      - name: Decide switch list check (static)
        run: npm run check:decide-switch -- --static
      - name: Cache version check (APP-07)
        run: npm run check:cache-version && node --test scripts/__tests__/check-cache-version.test.mjs
      - name: Mutation part plan and merged-score gate (05.4-43, D-172)
        run: node --test scripts/__tests__/mutation-shards.test.mjs scripts/__tests__/mutation-merge.test.mjs
      - name: Service-role key never referenced by client code (ENV-04)
        run: "! grep -rnE 'SERVICE_ROLE|service_role|sb_secret_' src app"
  # 05.4-43 (D-175): the per-push mutation check moved to mutation-changed.yml, outside this workflow's
  # cancel-in-progress group; the full run is mutation-full.yml.
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 (v4)
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1 # v8.30.1
  rls:
    name: rls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 (v4)
      # WR-C05: pinned to the same Supabase CLI as package.json's `supabase`
      # devDependency, so pgTAP (incl. the D-16 rounding mirror) runs on the
      # same CLI and Postgres image locally and in CI. Bump both together.
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v1.7.3 (v1)
        with: { version: 2.117.0 }
      # setup-cli points image pulls at ghcr.io, which rate-limits shared
      # runners ("toomanyrequests"); pull from the CLI's default public ECR instead.
      - run: supabase db start
        env: { SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws }
      - run: supabase test db
        env: { SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws }
  deno:
    name: deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 (v4)
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5 (v2)
        with: { deno-version: v2.x }
      - run: deno test --allow-read --node-modules-dir=none supabase/functions/read-pdf-statement/unpdf_integration_test.ts
