name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run depcruise
      - run: npm run check:ignores
      - run: npm run test:coverage
      - run: npm run verify:gates
      - name: Migration compatibility (FND-10)
        run: npm run lint:migrations
      - name: Migration gate self-test (FND-10)
        run: npm run verify:migrations
      - name: SQL rounding mirror matches the shared fixture (D-16)
        run: npm run check:money-mirror
      - name: Service-role key never referenced by client code (ENV-04)
        run: "! grep -rnE 'SERVICE_ROLE|service_role|sb_secret_' src app"
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
  rls:
    name: rls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # WR-C05: pinned to the same Supabase CLI as package.json's `supabase`
      # devDependency, so pgTAP (incl. the D-16 rounding mirror) runs on the
      # same CLI and Postgres image locally and in CI. Bump both together.
      - uses: supabase/setup-cli@v1
        with: { version: 2.117.0 }
      - run: supabase db start
      - run: supabase test db
