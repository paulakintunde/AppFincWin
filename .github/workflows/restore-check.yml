name: Restore check (monthly)
# 10-20 (DAT-05, D-08, D-19): restore the newest backup into a throwaway local Supabase stack, re-apply the deletion log,
# compare row counts. Fails (GitHub emails the repository owner for failed scheduled runs) on any mismatch or when the
# newest backup is older than 36 hours. Schedules fire only from the default branch (main).
# The age private key and the R2 restore token live ONLY in the `restore` environment (Path A in
# docs/ops/phase-10-owner-setup.md), never in the backup job. Path B: if that environment does not exist, the same three
# names are read as repository secrets; this file does not change.
on:
  schedule:
    - cron: '17 5 3 * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: restore-check
  cancel-in-progress: false
jobs:
  restore-check:
    name: restore-check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: restore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 (v4)
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v1.7.3 (v1)
        with: { version: 3.1.0 }
      - name: Install age and the Postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age postgresql-client
      - name: Restore the newest backup and check it
        run: bash scripts/ops/backup/restore-check.sh
        env:
          AGE_PRIVATE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RESTORE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RESTORE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # setup-cli points image pulls at ghcr.io, which rate-limits shared runners; use the public ECR (as ci.yml).
          SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
