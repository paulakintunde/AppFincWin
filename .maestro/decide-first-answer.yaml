# 06.1-32 UX-11 / APP-13: a new user's first answer from quick estimates, timed and tap-counted by the flow.
# Run signed in as a FRESH test account that has never opened Decide (no records, intro not yet seen, no safety net).
# Target 60 s / 8 taps (logged); hard limit 90 s / 12 taps (asserted). Typing is not a tap; every tapOn below is counted.
# Words are the real decide.screens / legal.decideIntro keys in src/i18n/locales (not the plan's draft wording).
appId: com.fincwin.app
name: Decide first answer (UX-11)
---
- runFlow: common/to-tabs.yaml
- evalScript: ${output.taps = 0}
- evalScript: ${output.t0 = Date.now()}
# 1. Decide tab
- tapOn: "Decide, tab, .*"
- evalScript: ${output.taps = output.taps + 1}
- assertVisible: "Can I afford it\\?"
# 2. What is it?
- tapOn:
    id: "check-what"
- evalScript: ${output.taps = output.taps + 1}
- inputText: "headphones"
# 3. Price
- tapOn: "Price"
- evalScript: ${output.taps = output.taps + 1}
- inputText: "199"
- hideKeyboard
# 4. Check it (a small buy goes straight to the answer, D-09)
- tapOn: "Check it"
- evalScript: ${output.taps = output.taps + 1}
# 5. The one-time intro card (D-120)
- extendedWaitUntil:
    visible: "How Decide answers"
    timeout: 15000
- tapOn: "Got it"
- evalScript: ${output.taps = output.taps + 1}
# 6. The first-answer safety-net question (D-14): Not set yet
- extendedWaitUntil:
    visible: "Do you have a safety net\\? About how much\\?"
    timeout: 10000
- tapOn: "Not set yet"
- evalScript: ${output.taps = output.taps + 1}
# 7. A fresh account is not ready: answer from quick estimates (ask, don't block)
- extendedWaitUntil:
    visible: "Not ready yet"
    timeout: 15000
- tapOn: "Answer from quick estimates"
- evalScript: ${output.taps = output.taps + 1}
- assertVisible: "A first answer from three estimates"
# 8-10. Three amounts
- tapOn: "About how much comes in each month\\?"
- evalScript: ${output.taps = output.taps + 1}
- inputText: "3000"
- tapOn: "About how much goes on bills\\?"
- evalScript: ${output.taps = output.taps + 1}
- inputText: "1200"
- tapOn: "About how much on everyday spending\\?"
- evalScript: ${output.taps = output.taps + 1}
- inputText: "800"
- hideKeyboard
- assertVisible: "A usual month leaves about .* by these estimates\\."
# 11. See the answer now
- tapOn: "See the answer now"
- evalScript: ${output.taps = output.taps + 1}
# The answer, and its basis line names the quick estimates (decide.v3.basis.quickEstimates)
- extendedWaitUntil:
    visible:
      id: "answer-verdict"
    timeout: 20000
- evalScript: ${output.ms = Date.now() - output.t0}
- scrollUntilVisible:
    element: ".*quick estimates.*"
    direction: DOWN
- assertVisible: "Based on your quick estimates, not your records\\.|.*and your quick estimates\\."
- scrollUntilVisible:
    element:
      id: "answer-footer"
    direction: DOWN
- evalScript: "${console.log('UX-11 first answer = ' + output.ms + ' ms, ' + output.taps + ' taps (target 60000 ms / 8 taps; limit 90000 ms / 12 taps)')}"
- assertTrue: ${output.ms <= 90000}
- assertTrue: ${output.taps <= 12}
