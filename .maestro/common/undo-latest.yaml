# Shared: undo the most recent change through History (Profile > History > Undo to here on the newest row).
# The newest row must be the change this flow made (the flows check its name first).
appId: com.fincwin.app
---
- runFlow: to-tabs.yaml
- tapOn: "Home, tab, 1 of [0-9]"
- scrollUntilVisible:
    element: "Profile"
    direction: UP
- tapOn: "Profile"
- scrollUntilVisible:
    element: "History"
    direction: DOWN
    centerElement: true
- tapOn: "History"
- assertVisible: "Undo to here, ${UNDO_NAME}"
- tapOn: "Undo to here, ${UNDO_NAME}"
- assertVisible: "Undo 1 change"
- tapOn: "Undo 1 change"
- assertNotVisible: "Undoing…"
- runFlow: to-tabs.yaml
