# Project: "Fincwin United" (us-west-2) -- the only live FincWin project.
# CLI installed (pinned devDependency, invoke via `npx supabase`), and the
# repo is linked: `npx supabase link --project-ref cohmcbdfgqmiwykztrdg`.
# See docs/decisions/supabase-environments.md for the environment map and
# the migrations-only rule.
project_id = "cohmcbdfgqmiwykztrdg"

# resolve-rate: client-invoked with the caller's JWT (verified by the
# gateway and again via a user-scoped read under RLS, T-01-11-01).
[functions.resolve-rate]
verify_jwt = true

# purge-statement-uploads (D-12): invoked hourly by pg_cron via net.http_post with its own
# shared secret (x-statement-purge-secret), not a user JWT.
[functions.purge-statement-uploads]
verify_jwt = false

# read-pdf-statement (IMP-01, D-01): client-invoked with the caller's JWT, verified by the
# gateway and again in-function (the path's folder must equal the caller's user id).
[functions.read-pdf-statement]
verify_jwt = true

# delete-account (08-22, D-40): client-invoked with the caller's JWT, verified by the gateway; the caller id comes only from
# auth.getUser() in the function (never the body). Deletes the auth user with the service role; the 08-14 trigger runs the household rule.
[functions.delete-account]
verify_jwt = true

# plan-webhook (09-06, D-13): called by RevenueCat, not a user. verify_jwt = false; its own HMAC secret
# (REVENUECAT_WEBHOOK_HMAC_SECRET) is checked in verify.ts. State is re-fetched from RevenueCat, never trusted from the body.
[functions.plan-webhook]
verify_jwt = false

# plan-refresh (09-07): caller mode checks the JWT in-function with auth.getUser() (delete-account pattern); sweep mode uses its own secret PLAN_SWEEP_SECRET from the cron job; both are needed so the cron can call it without a user JWT.
[functions.plan-refresh]
verify_jwt = false
